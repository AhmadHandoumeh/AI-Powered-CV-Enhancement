
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Enhancement</title>
</head>
<body>
    <h1>AI-Powered CV Enhancement</h1>

    <p>Improve your CV and match it with your target job.</p>

    <form>
        <label for="cv">Upload your CV (PDF):</label>
        <input type="file" id="cv" name="cv" accept=".pdf">

        <br><br>

        <label for="job">Job Description:</label>
        <textarea
            id="job"
            name="job_description"
            rows="8"
            cols="50"
            placeholder="Paste the target job description here..."
        ></textarea>

        <br><br>

        <button type="submit">Analyze CV</button>
    </form>
</body>
</html>
